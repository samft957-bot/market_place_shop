<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --ink:#101B2D;
    --paper:#E7F0FB;
    --paper-deep:#D2E3F6;
    --card:#F3F9FF;
    --brick:#2E5EE0;
    --mustard:#1FA7FF;
    --sage:#1B4B91;
    --line:#C6D8EE;
    --white:#FBFDFF;
    --hero-photo: url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600&q=80&auto=format&fit=crop");
    --gutter:clamp(14px,4vw,56px);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 92% 4%, rgba(46,94,224,.08), transparent 40%),
      radial-gradient(circle at 4% 96%, rgba(27,75,145,.10), transparent 42%);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  img{max-width:100%;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  button{font-family:'Space Grotesk',sans-serif;cursor:pointer;}
  input,textarea,select{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--sage); outline-offset:2px;
  }
  header{
    border-bottom:2px solid var(--ink);
    padding:16px var(--gutter);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    background:var(--card);
    position:sticky; top:0; z-index:30;
  }
  .brand{cursor:pointer;display:flex;align-items:center;gap:12px;border:none;background:none;padding:0;text-align:left;}
  .brand .mark{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(31,167,255,.45);
    position:relative;
    overflow:hidden;
  }
  .brand .mark img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .brand .mark::after{
    content:"";
    position:absolute;
    top:-60%;
    left:-60%;
    width:35%;
    height:220%;
    background:linear-gradient(100deg, transparent 0%, rgba(140,210,255,0) 25%, rgba(220,245,255,.9) 50%, rgba(140,210,255,0) 75%, transparent 100%);
    transform:rotate(18deg);
    animation:mark-shine 3.4s ease-in-out infinite;
  }
  @keyframes mark-shine{
    0%{left:-60%;}
    50%{left:130%;}
    100%{left:130%;}
  }
  @media (prefers-reduced-motion: reduce){
    .brand .mark::after{animation:none;display:none;}
  }
  .brand .name{
    font-weight:700;font-size:23px;letter-spacing:-0.4px;
    font-family:'Fraunces',serif;
    background:linear-gradient(100deg,#0E3A66 0%,#3FA9F5 22%,#D7F0FF 38%,#1F8FE0 52%,#0E3A66 68%,#3FA9F5 84%,#0E3A66 100%);
    background-size:250% auto;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 5px rgba(31,167,255,.5));
    animation:shine 4s linear infinite;
  }
  @keyframes shine{
    0%{background-position:0% center;}
    100%{background-position:-250% center;}
  }
  @media (prefers-reduced-motion: reduce){
    .brand .name{animation:none;}
  }
  .brand .tag{font-size:12px;opacity:.6;}
  .header-actions{display:flex;align-items:center;gap:10px;}
  main{padding:0 var(--gutter) 40px;max-width:none;width:100%;margin:0;}

  /* ===== Système de boutons ===== */
  .btn{
    font-weight:700;
    font-size:14px;
    padding:11px 18px;
    border-radius:999px;
    border:1.5px solid var(--ink);
    background:var(--white);
    color:var(--ink);
    transition:
      transform .16s ease,
      box-shadow .16s ease,
      filter .16s ease,
      background .16s ease;
    box-shadow:0 3px 0 rgba(28,38,32,.12);
  }
  .btn:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 14px rgba(28,38,32,.16);
  }
  .btn:active{
    transform:translateY(1px);
    box-shadow:0 2px 4px rgba(28,38,32,.12);
  }
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none !important;box-shadow:0 3px 0 rgba(28,38,32,.12) !important;filter:none !important;}

  .btn-primary{
    background:linear-gradient(135deg,#1B2C4D 0%,var(--ink) 100%);
    color:var(--paper);
    border-color:var(--ink);
    box-shadow:0 4px 0 #0f150f, 0 8px 18px rgba(28,38,32,.22);
  }
  .btn-primary:hover{
    filter:brightness(1.12);
    box-shadow:0 6px 0 #0f150f, 0 10px 22px rgba(28,38,32,.28);
  }

  .btn-accent{
    background:linear-gradient(135deg,#3B82F6,#1D4ED8);
    color:#FBFDFF;
    border-color:var(--ink);
    box-shadow:0 3px 0 rgba(0,0,0,.18);
    font-weight:700;
  }
  .btn-accent:hover{filter:brightness(1.1);}

  .btn-cart-add{
    background:linear-gradient(135deg,#8FAF82 0%,#5C7856 55%,#3E5238 100%);
    color:#F6F3E9;
    border-color:#2E3E2A;
    box-shadow:0 4px 0 #2E3E2A, 0 8px 18px rgba(62,82,56,.28);
    font-weight:800;
  }
  .btn-cart-add:hover{
    filter:brightness(1.1) saturate(1.05);
    box-shadow:0 6px 0 #2E3E2A, 0 10px 22px rgba(62,82,56,.34);
  }

  .btn-danger{
    background:var(--white);
    color:var(--brick);
    border-color:var(--brick);
    box-shadow:0 3px 0 rgba(174,74,60,.25);
  }
  .btn-danger:hover{
    background:var(--brick);
    color:var(--white);
    box-shadow:0 5px 0 #7c3428, 0 8px 16px rgba(174,74,60,.28);
  }

  .btn-sm{
    padding:7px 13px;
    font-size:12.5px;
    box-shadow:0 2px 0 rgba(28,38,32,.12);
  }
  .btn-sm:hover{box-shadow:0 4px 10px rgba(28,38,32,.16);}
  .btn-sm.btn-danger:hover{box-shadow:0 4px 10px rgba(174,74,60,.26);}

  /* Bouton Contact (en-tête) */
  .header-actions .btn-contact{
    background:linear-gradient(135deg,#2F6FE0 0%,#1B4B91 100%);
    color:#fff;
    border-color:#123566;
    box-shadow:0 4px 0 #0F2C57, 0 8px 18px rgba(27,75,145,.25);
  }
  .header-actions .btn-contact:hover{
    filter:brightness(1.08);
    box-shadow:0 6px 0 #0F2C57, 0 10px 22px rgba(27,75,145,.3);
  }

  /* Bouton Panier (en-tête) — non utilisé, conservé pour compatibilité */
  .header-actions .btn-cart{
    background:linear-gradient(135deg,#3FA9F5 0%,#1FA7FF 55%,#1665C9 100%);
    color:#0B1B33;
    border-color:#0F4C8C;
    box-shadow:0 4px 0 #0F4C8C, 0 8px 18px rgba(31,167,255,.22);
    font-weight:800;
  }
  .header-actions .btn-cart:hover{
    filter:brightness(1.08) saturate(1.08);
    box-shadow:0 6px 0 #0F4C8C, 0 10px 22px rgba(31,167,255,.28);
  }
  .header-actions .btn-cart.btn-accent{
    background:linear-gradient(135deg,#8FD3FF 0%,#3B82F6 50%,#1D4ED8 100%);
    color:#0B1B33;
    border-color:#123566;
  }

  /* Puces de filtre : cohérentes avec le nouveau système, plus discrètes */
  .filter-chip{
    transition:background .15s ease, color .15s ease, border-color .15s ease, transform .12s ease;
  }
  .filter-chip:hover{
    border-color:var(--ink);
    opacity:1;
    transform:translateY(-1px);
  }
  .filter-chip.active{box-shadow:0 3px 0 rgba(28,38,32,.15);}

  /* Bouton de fermeture du panier : cercle discret */
  .drawer-close{
    width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s ease, transform .12s ease;
  }
  .drawer-close:hover{background:var(--paper-deep);transform:rotate(90deg);}

  @media (max-width:700px){
    .header-actions{gap:7px;}
    .header-actions .btn{
      padding:9px 13px;
      font-size:13px;
    }
  }
  .hero{
    margin:0 calc(-1 * var(--gutter));
    padding:clamp(40px,8vw,90px) var(--gutter) clamp(32px,6vw,60px);
    background:
      linear-gradient(180deg, rgba(6,12,24,.35) 0%, rgba(6,12,24,.74) 100%),
      var(--hero-photo) center 38% / cover no-repeat;
    border-bottom:2px solid var(--ink);
    text-align:left;
  }
  .hero-inner{max-width:none;margin:0;}
  .hero h1{font-size:clamp(30px,6vw,64px);margin:0 0 10px;line-height:1.05;max-width:18ch;color:var(--white);}
  .hero p{margin:0;font-size:clamp(15px,1.6vw,18px);color:var(--white);opacity:.88;max-width:56ch;line-height:1.5;}
  .hero .strip{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .hero .chip{
    font-size:12.5px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--white);
    color:var(--white);backdrop-filter:blur(2px);font-weight:600;
  }
  .hero .chip.c1{background:rgba(27,75,145,.55);}
  .hero .chip.c2{background:rgba(46,94,224,.55);}
  .hero .chip.c3{background:rgba(31,167,255,.55);}
  .trust{
    display:grid; grid-template-columns:repeat(4,1fr); gap:0;
    border-bottom:2px solid var(--ink); background:var(--card);
    margin:0 calc(-1 * var(--gutter));
  }
  .trust-item{
    display:flex; align-items:center; gap:10px; padding:16px 18px;
    border-right:1.5px solid var(--line);
  }
  .trust-item:last-child{border-right:none;}
  .trust-item svg{flex-shrink:0;width:22px;height:22px;stroke:var(--brick);}
  .trust-item .t{font-size:12.5px;line-height:1.3;}
  .trust-item .t b{display:block;font-size:13px;}
  .trust-item .t span{opacity:.65;}
  @media (max-width:760px){
    .trust{grid-template-columns:repeat(2,1fr);}
    .trust-item{border-right:1.5px solid var(--line);}
    .trust-item:nth-child(2n){border-right:none;}
  }
  .section-title{font-size:26px;margin:0 0 4px;}
  .section-sub{opacity:.65;margin-top:0;margin-bottom:22px;font-size:14.5px;}
  .filter-bar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin:28px 0 20px; padding:14px; background:var(--card);
    border:1.5px solid var(--line); border-radius:8px;
  }
  .filter-bar .search{flex:1 1 220px; position:relative;}
  .filter-bar .search input{width:100%;padding:9px 11px 9px 32px;}
  .filter-bar .search svg{
    position:absolute; left:9px; top:50%; transform:translateY(-50%);
    width:15px;height:15px;stroke:var(--ink);opacity:.55;
  }
  .filter-bar select{padding:9px 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--white);font-size:13.5px;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .filter-chip{
    font-size:12.5px; padding:6px 12px; border-radius:99px; border:1.5px solid var(--line);
    background:var(--white); color:var(--ink); opacity:.75;
  }
  .filter-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);opacity:1;font-weight:600;}
  .header-actions .btn.fav-toggle{
    background:var(--white); color:var(--brick); border-color:var(--brick);
    box-shadow:0 3px 0 rgba(174,74,60,.2);
  }
  .header-actions .btn.fav-toggle.active{
    background:linear-gradient(135deg,#F0576B,#C4304A);
    color:#fff; border-color:#8A2137;
    box-shadow:0 3px 0 rgba(0,0,0,.18);
  }
  .header-actions .btn.fav-toggle:hover{filter:brightness(1.06);}
  .result-count{font-size:12.5px;opacity:.6;margin:-8px 0 18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:20px;}
  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:8px;
    overflow:hidden; display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:3px 4px 0 rgba(28,38,32,.14);
    border-color:var(--ink);
  }
  .card .photo{aspect-ratio:4/3; background:var(--paper-deep); overflow:hidden; position:relative;}
  .card .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
  .card:hover .photo img{transform:scale(1.06);}
  .card .placeholder{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--white);font-size:13px;text-align:center;padding:12px;
    background:linear-gradient(135deg,var(--sage),#0E2A52);
  }
  .card .cat-tag{
    position:absolute; top:10px; left:10px; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:99px; background:rgba(251,249,242,.92); color:var(--ink);
    border:1px solid var(--line);
  }
  .card .fav-btn{
    position:absolute; top:8px; right:8px; width:32px;height:32px;border-radius:50%;
    background:rgba(251,249,242,.92); border:1px solid var(--line); display:flex;align-items:center;justify-content:center;
    color:var(--ink); transition:transform .15s ease, color .15s ease, background .15s ease; padding:0;
  }
  .card .fav-btn svg{width:17px;height:17px;}
  .card .fav-btn:hover{transform:scale(1.12);}
  .card .fav-btn.active{color:var(--brick);}
  .card .body{padding:14px 14px 16px;border-top:1.5px dashed var(--line);display:flex;flex-direction:column;gap:8px;flex:1;}
  .card h3{margin:0;font-weight:600;font-size:20px;line-height:1.25;}
  .card p{margin:0;font-size:13px;opacity:.7;line-height:1.4;}
  .card .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px;gap:8px;}
  .price-tag{
    transform:rotate(-2deg); background:linear-gradient(135deg,#4C7DF0,var(--brick)); color:var(--white);
    font-weight:700; font-size:15px; padding:4px 10px; border-radius:3px;
    display:inline-block; box-shadow:1px 2px 0 rgba(0,0,0,.15); white-space:nowrap;
  }
  .field{display:block;margin-bottom:14px;}
  .field span{display:block;font-size:12.5px;opacity:.75;margin-bottom:5px;}
  .input{
    width:100%;padding:9px 11px;font-size:14px;border:1.5px solid var(--line);
    border-radius:4px;background:var(--white);color:var(--ink);outline:none;
  }
  .input:focus{border-color:var(--sage);}
  textarea.input{min-height:64px;resize:vertical;}
  .form-card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:20px;max-width:420px;}
  .note{
    background:var(--paper-deep);border:1.5px solid var(--line);border-radius:6px;
    padding:8px 12px;font-size:12.5px;opacity:.8;margin-bottom:16px;
  }
  .note.warn{background:#F3E1DC;border-color:var(--brick);opacity:1;}
  .divider{border-top:1.5px dashed var(--line);}
  .stars{display:inline-flex;gap:1px;}
  .star{font-size:16px;line-height:1;cursor:pointer;color:var(--line);transition:transform .1s ease, color .1s ease;user-select:none;}
  .star:hover{transform:scale(1.15);}
  .star.filled{color:var(--mustard);}
  .stars.readonly .star{cursor:default;}
  .stars.readonly .star:hover{transform:none;}
  .ratings-section{margin-top:36px;padding-top:26px;border-top:1.5px dashed var(--line);}
  .review-form{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:16px;max-width:420px;margin-bottom:22px;}
  .review-form .stars .star{font-size:20px;}
  .reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:16px;}
  .review-cube{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px;aspect-ratio:1/1;display:flex;flex-direction:column;gap:8px;overflow:hidden;}
  .review-cube .stars .star{font-size:15px;}
  .review-text{margin:0;font-size:13px;line-height:1.4;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;}
  .review-date{font-size:11px;opacity:.55;}
  .cart-limit-note{font-size:12px;opacity:.65;margin-top:6px;}
  .info-page{max-width:640px;padding-top:28px;}
  .info-page h2{font-size:26px;margin:0 0 6px;}
  .info-page h3{font-size:16px;margin:26px 0 6px;}
  .info-page p, .info-page li{font-size:14px;line-height:1.6;opacity:.85;}
  .info-page .placeholder-field{color:var(--brick);font-weight:600;}
  .back-link{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:600;opacity:.8;margin-bottom:18px;background:none;border:none;padding:0;cursor:pointer;}
  .back-link:hover{opacity:1;}
  footer{border-top:2px solid var(--ink);background:var(--card);padding:34px var(--gutter) 26px;margin-top:34px;}
  .footer-inner{max-width:none;margin:0;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:28px;}
  @media (max-width:700px){.footer-inner{grid-template-columns:1fr;}}
  .footer-col h4{font-family:'Fraunces',serif;font-size:15px;margin:0 0 12px;}
  .footer-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .footer-col ul button, .footer-col ul a{
    background:none;border:none;padding:0;font-size:13px;color:var(--ink);opacity:.75;cursor:pointer;text-align:left;text-decoration:none;
  }
  .footer-col ul button:hover, .footer-col ul a:hover{opacity:1;text-decoration:underline;}
  .footer-col p{font-size:13px;opacity:.75;line-height:1.5;margin:0 0 6px;}
  .phone-block{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .phone-icon{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--white);}
  .phone-icon svg{width:16px;height:16px;}
  .phone-text a{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;}
  .phone-text a:hover{text-decoration:underline;}
  .footer-bottom{max-width:none;margin:26px 0 0;padding-top:18px;border-top:1.5px solid var(--line);font-size:12px;opacity:.55;}
  #cartOverlay{position:fixed;inset:0;background:rgba(18,16,10,.38);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;}
  #cartOverlay.open{opacity:1;pointer-events:auto;}
  #cartDrawer{
    position:fixed;top:0;right:0;height:100%;width:min(380px, 92vw);
    background:var(--card);border-left:2px solid var(--ink);
    box-shadow:-6px 0 0 rgba(28,38,32,.08);
    transform:translateX(100%);transition:transform .22s ease;
    z-index:41;display:flex;flex-direction:column;
  }
  #cartDrawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1.5px dashed var(--line);flex-shrink:0;}
  .drawer-head h2{margin:0;font-size:20px;}
  .drawer-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink);padding:2px 6px;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .drawer-foot{padding:16px 20px 20px;border-top:1.5px dashed var(--line);flex-shrink:0;}
  .cart-item{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--line);border-radius:6px;padding:9px;}
  .cart-item .thumb{width:48px;height:48px;border-radius:4px;overflow:hidden;flex-shrink:0;}
  .cart-item .thumb img{width:100%;height:100%;object-fit:cover;}
  .cart-item .info{flex:1;min-width:0;}

<body>

<header>
  <button class="brand" onclick="setView('shop')" aria-label="Retour à l'accueil">
    <div class="mark"><img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMgAAADICAYAAACtWK6eAAEAAElEQVR42qT9d5xl11XngX7X3ifcVLmqc7daoRWsaMs550wyMB7iYHuGMUM0acAGLJgZxgxgGMBjjAmGccDGOGLLyJYtW[...]
    <div>
      <div class="name">Market place shop</div>
      <div class="tag">Votre marketplace, tout en un</div>
    </div>
  </button>
  <div class="header-actions" id="headerActions"></div>
</header>

<main id="main"></main>

<footer>
  <div class="footer-inner">
    <div class="footer-col">
      <h4>Market place shop</h4>
      <p>Vêtements de seconde main, sélectionnés et vérifiés avant chaque mise en vente.</p>
      <div class="phone-block">
        <div class="phone-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 1[...]
        <div class="phone-text"><a href="tel:+32466369367">+32 466 36 93 67</a></div>
      </div>
    </div>
    <div class="footer-col">
      <h4>Boutique</h4>
      <ul>
        <li><button id="footerSellerBtn" onclick="toggleSeller()">Mode vendeur</button></li>
        <li><button onclick="setView('shop')">Tous les articles</button></li>
      </ul>
    </div>
    <div class="footer-col">
      <h4>Informations légales</h4>
      <ul>
        <li><button onclick="setView('terms')">Livraison, retours &amp; CGV</button></li>
        <li><button onclick="setView('legal')">Mentions légales</button></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">© <span id="year"></span> Market place shop — Tous droits réservés</div>
</footer>

<div id="cartOverlay" onclick="toggleCart()"></div>
<aside id="cartDrawer"></aside>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// ---------- Paiement ----------
const BACKEND_URL = "https://market-place-shop-prime.onrender.com";

// ---------- State ----------
const uid = () => Math.random().toString(36).slice(2, 10);

const CATEGORIES = ["Vêtements", "Électroniques", "Maison & déco", "chaussures", "Autres"];

let state = {
  products: [
    { id: uid(), name: "Veste en jean délavée", price: 28, category: "Vêtements", description: "Taille M, coupe vintage, petite usure au col.", photo: "https://images.unsplash.com/photo-154307[...]
    { id: uid(), name: "Appareil photo argentique", price: 65, category: "Électroniques", description: "Fonctionnel, testé, sans étui.", photo: "https://images.unsplash.com/photo-1495707902641[...]
  ],
  cart: [],
  cartOpen: false,
  view: "shop",
  sellerMode: false,
  sellerToken: localStorage.getItem("mps_seller_token") || null,
  sellerTokenExpiresAt: Number(localStorage.getItem("mps_seller_token_expires_at") || 0),
  editing: null,
  order: null,
  formPhoto: null,
  query: "",
  categoryFilter: "Toutes",
  sortBy: "recent",
};

const currency = (n) => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });

async function saveProductsToStorage(){
  try {
    const headers = { "Content-Type": "application/json" };
    if (state.sellerToken) headers["Authorization"] = "Bearer " + state.sellerToken;
    const res = await fetch(`${BACKEND_URL}/products`, {
      method: "POST",
      headers,
      body: JSON.stringify({ products: state.products }),
    });
    if (res.status === 401){
      alert("Votre session vendeur a expiré. Reconnectez-vous pour enregistrer vos modifications.");
      state.sellerMode = false;
      state.sellerToken = null;
      state.sellerTokenExpiresAt = 0;
      localStorage.removeItem("mps_seller_token");
      localStorage.removeItem("mps_seller_token_expires_at");
      render();
      return;
    }
    if (!res.ok) throw new Error("Réponse serveur non OK : " + res.status);
    localStorage.setItem('mps_products_cache', JSON.stringify(state.products));
  } catch(e){
    console.error('Erreur de sauvegarde des articles (backend)', e);
    try {
      localStorage.setItem('mps_products_cache', JSON.stringify(state.products));
      alert("Le serveur de sauvegarde n'a pas répondu : tes changements sont gardés uniquement dans CE navigateur pour l'instant, pas sur les autres appareils. Vérifie que ton backend Render e[...
    } catch(e2){
      alert("La sauvegarde a échoué. Essayez une image plus légère ou une URL d'image.");
    }
  }
}

async function loadProductsFromStorage(){
  try {
    const res = await fetch(`${BACKEND_URL}/products`);
    if (!res.ok) throw new Error("Réponse serveur non OK : " + res.status);
    const data = await res.json();
    if (data && Array.isArray(data.products) && data.products.length){
      state.products = data.products;
      localStorage.setItem('mps_products_cache', JSON.stringify(state.products));
    } else if (state.sellerToken){
      await saveProductsToStorage();
    }
  } catch(e){
    console.error('Erreur de chargement des articles (backend), utilisation du cache local', e);
    const cached = localStorage.getItem('mps_products_cache');
    if (cached) { try { state.products = JSON.parse(cached); } catch(e2){} }
  }
}

function loadReviews(){
  try { const raw = localStorage.getItem('mps_reviews'); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveReviews(list){ try { localStorage.setItem('mps_reviews', JSON.stringify(list)); } catch(e){} }
function hasPurchased(){ try { return localStorage.getItem('mps_has_purchased') === 'true'; } catch(e){ return false; } }
function markAsPurchased(){ try { localStorage.setItem('mps_has_purchased', 'true'); } catch(e){} }
function clearPurchasedFlag(){ try { localStorage.setItem('mps_has_purchased', 'false'); } catch(e){} }

function loadFavorites(){
  try {
    const raw = localStorage.getItem('mps_favorites');
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function saveFavorites(){ try { localStorage.setItem('mps_favorites', JSON.stringify(state.favorites)); } catch(e){} }
function isFavorite(id){ return state.favorites.includes(id); }
function toggleFavorite(id){
  if (isFavorite(id)) state.favorites = state.favorites.filter(x => x !== id);
  else state.favorites = [...state.favorites, id];
  saveFavorites();
  render();
}
function goFavorites(){ setView('favorites'); }

state.reviews = loadReviews();
state.favorites = loadFavorites();
state.draftStars = 0;

function setDraftStars(n){ state.draftStars = n; render(); }

function submitReview(e){
  e.preventDefault();
  if (!hasPurchased()) return;
  const textEl = document.getElementById('review-text');
  const text = textEl ? textEl.value.trim() : "";
  if (!state.draftStars){ alert("Choisissez une note en étoiles."); return; }
  if (!text){ alert("Écrivez un petit commentaire."); return; }
  state.reviews.unshift({ id: uid(), stars: state.draftStars, text, date: new Date().toLocaleDateString('fr-FR') });
  saveReviews(state.reviews);
  state.draftStars = 0;
  clearPurchasedFlag();
  render();
}

function draftStarsHtml(){
  let stars = '';
  for (let i = 1; i <= 5; i++){
    const filled = i <= state.draftStars;
    stars += `<span class="star${filled ? ' filled' : ''}" onclick="setDraftStars(${i})" title="${i} étoile${i>1?'s':''}">★</span>`;
  }
  return stars;
}

function reviewCubeHtml(r){
  let stars = '';
  for (let i = 1; i <= 5; i++){ stars += `<span class="star${i <= r.stars ? ' filled' : ''}">★</span>`; }
  return `
    <div class="review-cube">
      <div class="stars readonly">${stars}</div>
      <p class="review-text">${escapeHtml(r.text)}</p>
      <div class="review-date">${r.date}</div>
    </div>
  `;
}

function averageRating(){
  if (!state.reviews.length) return null;
  const sum = state.reviews.reduce((s,r)=>s+r.stars,0);
  return (sum / state.reviews.length);
}

function ratingsSectionHtml(){
  const canWrite = hasPurchased();
  const writeBox = canWrite
    ? `
      <form class="review-form" onsubmit="submitReview(event)">
        <div class="stars" style="margin-bottom:8px;">${draftStarsHtml()}</div>
        <textarea class="input" id="review-text" placeholder="Partagez votre expérience..." style="min-height:70px;"></textarea>
        <button type="submit" class="btn btn-accent" style="margin-top:8px;">Publier mon avis</button>
      </form>
    `
    : `<div class="note">Vous pourrez laisser un avis une fois un achat effectué.</div>`;
  const cubes = state.reviews.length
    ? `<div class="reviews-grid">${state.reviews.map(reviewCubeHtml).join("")}</div>`
    : `<p style="opacity:.6;font-size:13.5px;">Aucun avis pour le moment. Soyez le·la premier·ère à en laisser un.</p>`;
  const avg = averageRating();
  const avgHtml = avg
    ? `<span style="font-weight:600;">${avg.toFixed(1)} / 5</span> sur ${state.reviews.length} avis`
    : "";
  return `
    <section class="ratings-section">
      <h2 class="section-title" style="font-size:22px;">Avis clients</h2>
      <p class="section-sub">${avgHtml || "Ce que pensent nos acheteurs."}</p>
      ${writeBox}
      ${cubes}
    </section>
  `;
}

function setView(v){ state.view = v; state.cartOpen = false; window.scrollTo({top:0}); render(); }

function toggleCart(){ state.cartOpen = !state.cartOpen; render(); }

async function toggleSeller(){
  if (state.sellerMode){
    state.sellerMode = false;
    state.sellerToken = null;
    state.sellerTokenExpiresAt = 0;
    localStorage.removeItem("mps_seller_token");
    localStorage.removeItem("mps_seller_token_expires_at");
    state.view = "shop";
    state.editing = null;
    render();
    return;
  }
  const pwd = window.prompt("Mot de passe vendeur :");
  if (pwd === null || pwd === "") return;
  try {
    const res = await fetch(`${BACKEND_URL}/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwd }),
    });
    if (!res.ok){ alert("Mot de passe incorrect."); return; }
    const data = await res.json();
    if (!data.token){ alert("Réponse du serveur inattendue."); return; }
    state.sellerToken = data.token;
    state.sellerTokenExpiresAt = Number(data.expiresAt || 0);
    localStorage.setItem("mps_seller_token", data.token);
    localStorage.setItem("mps_seller_token_expires_at", String(state.sellerTokenExpiresAt));
    state.sellerMode = true;
    state.view = "admin";
    state.editing = null;
    render();
  } catch(e){
    alert("Impossible de vérifier le mot de passe : le serveur d'authentification n'a pas répondu. Le mode vendeur reste protégé côté serveur, contactez votre développeur pour vérifier qu[...]
  }
}

function addToCart(id){
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  const already = state.cart.find(x => x.id === id);
  if (already){
    already.qty += 1;
  } else {
    state.cart.push({ ...p, qty: 1 });
  }
  state.cartOpen = true;
  render();
}

function buyNow(id){
  const p = state.products.find(x => x.id === id);
  if (!p) return;
  state.cart = [{ ...p, qty: 1 }];
  goCheckout();
}

function setQty(id, qty){ if (qty <= 0) { state.cart = state.cart.filter(x => x.id !== id); } render(); }
function removeFromCart(id){ state.cart = state.cart.filter(x => x.id !== id); render(); }

function startEdit(id){
  state.editing = id ? state.products.find(p => p.id === id) : "new";
  state.formPhoto = state.editing === "new" ? null : state.editing.photo;
  render();
}
function cancelEdit(){ state.editing = null; state.formPhoto = null; render(); }

async function deleteProduct(id){
  if (!window.confirm("Retirer définitivement cet article de la boutique ?")) return;
  state.products = state.products.filter(p => p.id !== id);
  render();
  await saveProductsToStorage();
}

async function saveProduct(e){
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const price = Number(document.getElementById('f-price').value);
  const category = document.getElementById('f-category').value;
  const description = document.getElementById('f-desc').value.trim();
  const paymentLink = document.getElementById('f-paylink').value.trim();
  if (!name || !(price > 0)) return;
  const isNew = state.editing === "new";
  const id = isNew ? uid() : state.editing.id;
  const product = { id, name, price, category, description, photo: state.formPhoto, paymentLink: paymentLink || null };
  if (isNew) state.products.unshift(product);
  else state.products = state.products.map(p => p.id === id ? product : p);
  state.editing = null;
  state.formPhoto = null;
  render();
  await saveProductsToStorage();
}

function handleFile(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { state.formPhoto = reader.result; render(); };
  reader.readAsDataURL(file);
}
function setPhotoUrl(){
  const val = document.getElementById('f-photourl').value.trim();
  if (val) { state.formPhoto = val; render(); }
}
function clearPhoto(){ state.formPhoto = null; render(); }

function goCheckout(){ state.view = "checkout"; state.cartOpen = false; render(); }

async function payWithStripe(){
  const btn = document.getElementById('pay-btn');
  btn.disabled = true; btn.textContent = "Redirection vers Stripe...";
  try {
    const res = await fetch(`${BACKEND_URL}/create-checkout-session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cart: state.cart.map(i => ({ id: i.id, qty: i.qty })),
        successUrl: window.location.origin + window.location.pathname + "?payment=success",
        cancelUrl: window.location.origin + window.location.pathname + "?payment=cancel",
      }),
    });
    const data = await res.json();
    if (data.url) { window.location.href = data.url; }
    else {
      alert("Erreur : " + (data.error || "impossible de créer le paiement."));
      btn.disabled = false; btn.textContent = "Payer avec Stripe";
    }
  } catch (err) {
    alert("Impossible de contacter le serveur de paiement. Vérifiez que BACKEND_URL est bien configuré.");
    btn.disabled = false; btn.textContent = "Payer avec Stripe";
  }
}

(function checkPaymentReturn(){
  const params = new URLSearchParams(window.location.search);
  if (params.get("payment") === "success"){
    state.cart = [];
    state.view = "confirmation";
    markAsPurchased();
    window.history.replaceState({}, "", window.location.pathname);
  } else if (params.get("payment") === "cancel"){
    state.view = "shop";
    state.cartOpen = true;
    window.history.replaceState({}, "", window.location.pathname);
  }
})();

function backToShopAfterOrder(){ state.order = null; state.view = "shop"; render(); }

function setQuery(v){
  state.query = v;
  const main = document.getElementById('main');
  if (!main || state.view !== "shop") {
    render();
    return;
  }
  const active = document.activeElement;
  const search = active && active.matches('.filter-bar .search input') ? active : null;
  const cursorStart = search ? search.selectionStart : null;
  const cursorEnd = search ? search.selectionEnd : null;
  main.innerHTML = renderShop();
  const newSearch = main.querySelector('.filter-bar .search input');
  if (newSearch) {
    newSearch.focus();
    if (cursorStart !== null && cursorEnd !== null) {
      newSearch.setSelectionRange(cursorStart, cursorEnd);
    }
  }
  const drawer = document.getElementById('cartDrawer');
  const overlay = document.getElementById('cartOverlay');
  drawer.innerHTML = renderCartDrawer();
  drawer.classList.toggle('open', state.cartOpen);
  overlay.classList.toggle('open', state.cartOpen);
  refreshAds();
}
function setCategoryFilter(c){ state.categoryFilter = c; render(); }
function setSortBy(v){ state.sortBy = v; render(); }

function filteredProducts(){
  let list = state.products.slice();
  if (state.query.trim()){
    const q = state.query.trim().toLowerCase();
    list = list.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.description || "").toLowerCase().includes(q) ||
      (p.category || "").toLowerCase().includes(q)
    );
  }
  if (state.categoryFilter !== "Toutes"){
    list = list.filter(p => p.category === state.categoryFilter);
  }
  if (state.sortBy === "price-asc") list.sort((a,b)=>a.price-b.price);
  else if (state.sortBy === "price-desc") list.sort((a,b)=>b.price-a.price);
  return list;
}

function adSlotHtml(id){
  const adClient = "ca-pub-XXXXXXXXXXXXXXXX";
  if (adClient.includes("XXXXXXXXXX")) return "";
  return `
    <div class="ad-slot" style="margin:10px 0;text-align:center;">
      <ins class="adsbygoogle" style="display:block" data-ad-client="${adClient}" data-ad-slot="XXXXXXXXXX" data-ad-format="auto" data-full-width-responsive="true"></ins>
    </div>
  `;
}
function refreshAds(){
  try {
    document.querySelectorAll('.ad-slot ins.adsbygoogle:not([data-adsbygoogle-status])')
      .forEach(() => (window.adsbygoogle = window.adsbygoogle || []).push({}));
  } catch(e) { /* AdSense pas encore chargé ou bloqué par un bloqueur de pub */ }
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderHeaderActions(){
  const el = document.getElementById('headerActions');
  const fav = state.view === 'favorites';
  const cartCount = state.cart.reduce((sum, item) => sum + item.qty, 0);

  let html = `
    <button class="btn fav-toggle${fav ? ' active' : ''}" onclick="goFavorites()">${fav ? '♥' : '♡'} Mes favoris${state.favorites.length ? ` (${state.favorites.length})` : ''}</button>
    <button class="btn btn-cart" onclick="toggleCart()">Panier${cartCount ? ` (${cartCount})` : ''}</button>
    <button class="btn btn-contact" onclick="setView('contact')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-2px;margin-right:6px;">
        <path d="M4 5h2l2.2 9.1a1 1 0 0 0 1 .9h7.7a1 1 0 0 0 1-.8L20 7H7"/>
        <circle cx="10" cy="18.5" r="1.2"/>
        <circle cx="17" cy="18.5" r="1.2"/>
      </svg>
      Contact
    </button>
  `;
  el.innerHTML = html;

  const footerBtn = document.getElementById('footerSellerBtn');
  if (footerBtn){
    footerBtn.textContent = state.sellerMode ? "Quitter le mode vendeur" : "Mode vendeur";
  }
}

function trustStripHtml(){
  const items = [
    { icon: `<path d="M6 11V7a6 6 0 0 1 12 0v4M5 11h14v10H5z"/>`, title: "Paiement sécurisé", sub: "Chiffré via Stripe" },
    { icon: `<path d="M3 7h11v10H3zM14 10h4l3 3v4h-7z"/><circle cx="7.5" cy="18.5" r="1.5"/><circle cx="17.5" cy="18.5" r="1.5"/>`, title: "Livraison suivie", sub: "Numéro de suivi fourni" },
    { icon: `<path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/>`, title: "Retours simples", sub: "Sous 14 jours" },
    { icon: `<path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6-4.6-4.1 6.1-.6z"/>`, title: "Articles vérifiés", sub: "Contrôlés avant envoi" },
  ];
  return `<div class="trust">${items.map(i => `
    <div class="trust-item">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${i.icon}</svg>
      <div class="t"><b>${i.title}</b><span>${i.sub}</span></div>
    </div>`).join("")}</div>`;
}

function productCardHtml(p, sellerView){
  const photo = p.photo ? `<img src="${p.photo}" alt="${escapeHtml(p.name)}" loading="lazy">` : `<div class="placeholder">Pas de photo</div>`;
  const buyAction = p.paymentLink ? `window.open('${p.paymentLink.replace(/'/g, "&#39;")}', '_blank')` : `buyNow('${p.id}')`;
  const actions = sellerView
    ? `<div style="display:flex;gap:6px;">
         <button class="btn btn-sm" onclick="startEdit('${p.id}')">Modifier</button>
         <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">Retirer</button>
       </div>`
    : `<div style="display:flex;gap:6px;flex-wrap:wrap;">
         <button class="btn btn-sm btn-cart-add" onclick="event.stopPropagation(); addToCart('${p.id}')">Ajouter au panier</button>
         <button class="btn btn-sm btn-accent" onclick="${buyAction}">Acheter</button>
       </div>`;
  const catTag = p.category ? `<span class="cat-tag">${escapeHtml(p.category)}</span>` : "";
  const fav = isFavorite(p.id);
  const favBtn = sellerView ? "" : `
    <button class="fav-btn${fav ? ' active' : ''}" onclick="event.stopPropagation();toggleFavorite('${p.id}')" aria-label="${fav ? 'Retirer des favoris' : 'Ajouter aux favoris'}" title="${fav ? 'Retirer des favoris' : 'Ajouter aux favoris'}">
      <svg viewBox="0 0 24 24" fill="${fav ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </button>`;
  return `
    <div class="card">
      <div class="photo">${photo}${catTag}${favBtn}</div>
      <div class="body">
        <h3>${escapeHtml(p.name)}</h3>
        ${p.description ? `<p>${escapeHtml(p.description)}</p>` : ""}
        ${sellerView ? `<div style="font-size:11.5px;opacity:.6;">${p.paymentLink ? "✓ Paiement Stripe configuré" : "Paiement de démo (pas de lien Stripe)"}</div>` : ""}
        <div class="row">
          <span class="price-tag">${currency(p.price)}</span>
          ${actions}
        </div>
      </div>
    </div>`;
}

function filterBarHtml(){
  const cats = ["Toutes", ...CATEGORIES];
  return `
    <div class="filter-bar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="input" placeholder="Rechercher un article..." value="${escapeHtml(state.query)}" oninput="setQuery(this.value)">
      </div>
      <select onchange="setSortBy(this.value)">
        <option value="recent" ${state.sortBy==='recent'?'selected':''}>Plus récents</option>
        <option value="price-asc" ${state.sortBy==='price-asc'?'selected':''}>Prix croissant</option>
        <option value="price-desc" ${state.sortBy==='price-desc'?'selected':''}>Prix décroissant</option>
      </select>
    </div>
    <div class="filter-chips" style="margin-bottom:8px;">
      ${cats.map(c => `<button class="filter-chip ${state.categoryFilter===c?'active':''}" onclick="setCategoryFilter('${c.replace(/'/g,"&#39;")}')">${escapeHtml(c)}</button>`).join("")}
    </div>
  `;
}

function renderShop(){
  const list = filteredProducts();
  return `
    <section>
      ${trustStripHtml()}
      <div style="padding-top:24px;">
        <h2 class="section-title">Boutique</h2>
        <p class="section-sub">Des liens de confiance et des pièces selectionnées avec soin.</p>
        ${filterBarHtml()}
        <div class="result-count">${list.length} article${list.length > 1 ? 's' : ''} trouvé${list.length > 1 ? 's' : ''}</div>
        <div class="grid">${list.map(p => productCardHtml(p, false)).join("")}</div>
      </div>
      ${ratingsSectionHtml()}
    </section>
  `;
}

function render(){
  renderHeaderActions();

  const main = document.getElementById('main');
  if (!main) return;

  let content = "";
  switch (state.view) {
    case 'favorites':
      const favs = state.products.filter(p => state.favorites.includes(p.id));
      content = `
        <section style="padding-top:24px;">
          <button class="back-link" onclick="setView('shop')">← Retour à la boutique</button>
          <h2 class="section-title">Mes favoris</h2>
          <p class="section-sub">${favs.length ? 'Vos articles préférés.' : 'Aucun favori pour le moment.'}</p>
          <div class="grid">${favs.length ? favs.map(p => productCardHtml(p, false)).join("") : '<div style="opacity:.65;">Ajoutez des articles à vos favoris depuis les cartes.</div>'}</div>
        </section>
      `;
      break;
    case 'contact':
      content = `
        <section class="info-page">
          <button class="back-link" onclick="setView('shop')">← Retour à la boutique</button>
          <h2>Contact</h2>
          <p>Besoin d’aide ? Nous répondons par téléphone ou par e-mail dans les 24h.</p>
          <h3>Par téléphone</h3>
          <p><strong>+32 466 36 93 67</strong></p>
          <h3>Par e-mail</h3>
          <p>bonjour@marketplaceshop.be</p>
        </section>
      `;
      break;
    case 'terms':
      content = `
        <section class="info-page">
          <button class="back-link" onclick="setView('shop')">← Retour à la boutique</button>
          <h2>Livraison, retours &amp; CGV</h2>
          <p>Expédition sous 48h après validation de paiement. Suivi par e-mail et SMS.</p>
          <h3>Retours</h3>
          <p>Retours acceptés sous 14 jours sur les articles non portés et dans leur état d'origine.</p>
          <h3>CGV</h3>
          <p>Les présentes conditions sont valables pour tous achats effectués sur le site.</p>
        </section>
      `;
      break;
    case 'legal':
      content = `
        <section class="info-page">
          <button class="back-link" onclick="setView('shop')">← Retour à la boutique</button>
          <h2>Mentions légales</h2>
          <p>Market place shop — Marketplace dédiée à la seconde main et aux objets de qualité.</p>
          <p>Siège social : Belgique</p>
          <p>Contact : +32 466 36 93 67</p>
        </section>
      `;
      break;
    case 'admin':
      if (!state.sellerMode) { state.view = 'shop'; render(); return; }
      const grid = state.products.map(p => `
        <div class="card" style="padding:14px;">
          <h3>${escapeHtml(p.name)}</h3>
          <p>${currency(p.price)}</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="startEdit('${p.id}')">Modifier</button>
            <button class="btn btn-sm btn-danger" onclick="deleteProduct('${p.id}')">Retirer</button>
          </div>
        </div>
      `).join("");
      content = `
        <section style="padding-top:24px;">
          <button class="back-link" onclick="setView('shop')">← Retour à la boutique</button>
          <h2 class="section-title">Mode vendeur</h2>
          <p class="section-sub">Gérez vos produits et vos prix.</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">
            <button class="btn btn-primary" onclick="startEdit('new')">Ajouter un article</button>
          </div>
          <div class="grid">${grid}</div>
        </section>
      `;
      break;
    case 'checkout':
      const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      content = `
        <section style="padding-top:24px;max-width:720px;">
          <button class="back-link" onclick="setView('shop')">← Retour à la boutique</button>
          <h2 class="section-title">Panier</h2>
          <p class="section-sub">Vérifiez vos articles avant paiement.</p>
          <div class="grid" style="grid-template-columns:1fr; gap:12px;">
            ${state.cart.map(item => `
              <div class="cart-item" style="display:flex;justify-content:space-between;align-items:center;">
                <div style="display:flex;align-items:center;gap:10px;"> 
                  <div class="thumb"><img src="${item.photo || ''}" alt="${escapeHtml(item.name)}"></div>
                  <div>
                    <div class="n">${escapeHtml(item.name)}</div>
                    <div class="p">${item.qty} × ${currency(item.price)}</div>
                  </div>
                </div>
                <div style="font-weight:700;">${currency(item.price * item.qty)}</div>
              </div>
            `).join("") || '<div class="note">Votre panier est vide.</div>'}
          </div>
          <div style="margin-top:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
            <strong>Total : ${currency(total)}</strong>
            <button id="pay-btn" class="btn btn-accent" onclick="payWithStripe()" ${state.cart.length ? '' : 'disabled'}>Payer avec Stripe</button>
          </div>
        </section>
      `;
      break;
    case 'confirmation':
      content = `
        <section class="info-page">
          <h2>Commande confirmée</h2>
          <p>Votre paiement a bien été accepté. Un e-mail de confirmation va vous être envoyé.</p>
          <button class="btn btn-primary" onclick="backToShopAfterOrder()">Retour à la boutique</button>
        </section>
      `;
      break;
    default:
      content = renderShop();
  }

  main.innerHTML = content;

  const drawer = document.getElementById('cartDrawer');
  const overlay = document.getElementById('cartOverlay');
  if (drawer) {
    drawer.innerHTML = renderCartDrawer();
    drawer.classList.toggle('open', state.cartOpen);
  }
  if (overlay) overlay.classList.toggle('open', state.cartOpen);
  refreshAds();
}

function renderCartDrawer(){
  const total = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  return `
    <div class="drawer-head">
      <h2>Panier</h2>
      <button class="drawer-close btn" onclick="toggleCart()" aria-label="Fermer le panier">×</button>
    </div>
    <div class="drawer-body">
      ${state.cart.length ? state.cart.map(item => `
        <div class="cart-item">
          <div class="thumb"><img src="${item.photo || ''}" alt="${escapeHtml(item.name)}"></div>
          <div class="info">
            <div class="n">${escapeHtml(item.name)}</div>
            <div class="p">${item.qty} × ${currency(item.price)}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
            <strong>${currency(item.price * item.qty)}</strong>
            <button class="btn btn-sm btn-danger" onclick="removeFromCart('${item.id}')">Retirer</button>
          </div>
        </div>
      `).join("") : '<div class="note">Votre panier est vide.</div>'}
    </div>
    <div class="drawer-foot">
      <div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:12px;">
        <span>Total</span>
        <span>${currency(total)}</span>
      </div>
      <button class="btn btn-accent" style="width:100%;" onclick="goCheckout()" ${state.cart.length ? '' : 'disabled'}>Voir le panier</button>
    </div>
  `;
}

(async function init(){
  await loadProductsFromStorage();
  render();
})();
</script>
</body>
</html>
