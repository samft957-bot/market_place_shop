<meta name="theme-color" content="#1C2620">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap');

  :root{
    --ink:#1C2620;
    --paper:#E9E4D4;
    --paper-deep:#DED6BF;
    --card:#F6F3E9;
    --brick:#AE4A3C;
    --mustard:#D9A441;
    --sage:#6E8368;
    --line:#C9C0A4;
    --white:#FBF9F2;
    --hero-photo: url("https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1600&q=80&auto=format&fit=crop");
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 92% 4%, rgba(174,74,60,.08), transparent 40%),
      radial-gradient(circle at 4% 96%, rgba(110,131,104,.10), transparent 42%);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  button{font-family:'Space Grotesk',sans-serif;cursor:pointer;}
  input,textarea,select{font-family:'Space Grotesk',sans-serif;}
  a{color:inherit;}

  /* Focus visibility for keyboard users — accessible and looks intentional, not an afterthought */
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--sage); outline-offset:2px;
  }

  header{
    border-bottom:2px solid var(--ink);
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
    background:var(--card);
    position:sticky; top:0; z-index:30;
  }
  .brand{cursor:pointer;display:flex;align-items:center;gap:12px;border:none;background:none;padding:0;text-align:left;}
  .brand .mark{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--ink);
    position:relative;
    overflow:hidden;
  }
  .brand .mark img{
    width:100%;height:100%;object-fit:cover;display:block;
  }
  .brand .mark::after{
    content:"";
    position:absolute;
    top:-60%;
    left:-60%;
    width:35%;
    height:220%;
    background:linear-gradient(100deg, transparent 0%, rgba(247,217,119,0) 25%, rgba(255,246,208,.9) 50%, rgba(247,217,119,0) 75%, transparent 100%);
    transform:rotate(18deg);
    animation:mark-shine 3.4s ease-in-out infinite;
  }
  @keyframes mark-shine{
    0%{left:-60%;}
    50%{left:130%;}
    100%{left:130%;}
  }
  @media (prefers-reduced-motion: reduce){
    .brand .mark::after{animation:none;display:none;}
  }
  .brand .name{
    font-weight:700;font-size:23px;letter-spacing:-0.4px;
    font-family:'Fraunces',serif;
    background:linear-gradient(100deg,#8a6a1e 0%,#f7d977 22%,#fff6d0 38%,#e0ab2e 52%,#8a6a1e 68%,#f7d977 84%,#8a6a1e 100%);
    background-size:250% auto;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    filter:drop-shadow(0 0 5px rgba(232,180,64,.5));
    animation:shine 4s linear infinite;
  }
  @keyframes shine{
    0%{background-position:0% center;}
    100%{background-position:-250% center;}
  }
  @media (prefers-reduced-motion: reduce){
    .brand .name{animation:none;}
  }
  .brand .tag{font-size:12px;opacity:.6;}
  .header-actions{display:flex;align-items:center;gap:10px;}

  main{padding:0 24px 40px;max-width:1080px;margin:0 auto;}

  .btn{
    font-weight:500;font-size:14px;padding:10px 18px;border-radius:4px;
    border:2px solid var(--ink); background:transparent; color:var(--ink);
    transition:transform .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-accent{
    background:linear-gradient(135deg,#F2B94D,#E8873A);
    color:#241a06;border-color:var(--ink);
    box-shadow:0 3px 0 rgba(0,0,0,.18);
    font-weight:700;
  }
  .btn-accent:hover{filter:brightness(1.06);}
  .btn-danger{background:transparent;color:var(--brick);border-color:var(--brick);}
  .btn-sm{padding:7px 12px;font-size:12.5px;}

  .hero{
    margin:0 -24px 0;
    padding:64px 24px 46px;
    background:
      linear-gradient(180deg, rgba(18,16,10,.35) 0%, rgba(18,16,10,.72) 100%),
      var(--hero-photo) center 38% / cover no-repeat;
    border-bottom:2px solid var(--ink);
    text-align:left;
  }
  .hero-inner{max-width:1080px;margin:0 auto;}
  .hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 10px;line-height:1.05;max-width:15ch;color:var(--white);}
  .hero p{margin:0;font-size:15.5px;color:var(--white);opacity:.88;max-width:46ch;line-height:1.5;}
  .hero .strip{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap;}
  .hero .chip{
    font-size:12.5px;padding:5px 12px;border-radius:99px;border:1.5px solid var(--white);
    color:var(--white);backdrop-filter:blur(2px);font-weight:600;
  }
  .hero .chip.c1{background:rgba(110,131,104,.55);}
  .hero .chip.c2{background:rgba(174,74,60,.55);}
  .hero .chip.c3{background:rgba(217,164,65,.55);}

  /* Trust strip: one quiet, orderly row — the hero already did the "bold" moment */
  .trust{
    display:grid; grid-template-columns:repeat(4,1fr); gap:0;
    border-bottom:2px solid var(--ink); background:var(--card);
  }
  .trust-item{
    display:flex; align-items:center; gap:10px; padding:16px 18px;
    border-right:1.5px solid var(--line);
  }
  .trust-item:last-child{border-right:none;}
  .trust-item svg{flex-shrink:0;width:22px;height:22px;stroke:var(--brick);}
  .trust-item .t{font-size:12.5px;line-height:1.3;}
  .trust-item .t b{display:block;font-size:13px;}
  .trust-item .t span{opacity:.65;}
  @media (max-width:760px){
    .trust{grid-template-columns:repeat(2,1fr);}
    .trust-item{border-right:1.5px solid var(--line);}
    .trust-item:nth-child(2n){border-right:none;}
  }

  .section-title{font-size:26px;margin:0 0 4px;}
  .section-sub{opacity:.65;margin-top:0;margin-bottom:22px;font-size:14.5px;}

  /* Search + filters */
  .filter-bar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:center;
    margin:28px 0 20px; padding:14px; background:var(--card);
    border:1.5px solid var(--line); border-radius:8px;
  }
  .filter-bar .search{flex:1 1 220px; position:relative;}
  .filter-bar .search input{width:100%;padding:9px 11px 9px 32px;}
  .filter-bar .search svg{
    position:absolute; left:9px; top:50%; transform:translateY(-50%);
    width:15px;height:15px;stroke:var(--ink);opacity:.55;
  }
  .filter-bar select{padding:9px 10px;border:1.5px solid var(--line);border-radius:4px;background:var(--white);font-size:13.5px;}
  .filter-chips{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-chip{
    font-size:12.5px; padding:6px 12px; border-radius:99px; border:1.5px solid var(--line);
    background:var(--white); color:var(--ink); opacity:.75;
  }
  .filter-chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);opacity:1;font-weight:600;}
  .result-count{font-size:12.5px;opacity:.6;margin:-8px 0 18px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;}

  .card{
    background:var(--card); border:1.5px solid var(--line); border-radius:8px;
    overflow:hidden; display:flex; flex-direction:column;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:3px 4px 0 rgba(28,38,32,.14);
    border-color:var(--ink);
  }
  .card .photo{aspect-ratio:4/3; background:var(--paper-deep); overflow:hidden; position:relative;}
  .card .photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
  .card:hover .photo img{transform:scale(1.06);}
  .card .placeholder{
    width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    color:var(--white);font-size:13px;text-align:center;padding:12px;
    background:linear-gradient(135deg,var(--sage),#4E5F49);
  }
  .card .cat-tag{
    position:absolute; top:10px; left:10px; font-size:11px; font-weight:600;
    padding:4px 9px; border-radius:99px; background:rgba(251,249,242,.92); color:var(--ink);
    border:1px solid var(--line);
  }
  .card .body{padding:14px 14px 16px;border-top:1.5px dashed var(--line);display:flex;flex-direction:column;gap:8px;flex:1;}
  .card h3{margin:0;font-weight:600;font-size:17px;line-height:1.25;}
  .card p{margin:0;font-size:13px;opacity:.7;line-height:1.4;}
  .card .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:8px;gap:8px;}

  .price-tag{
    transform:rotate(-2deg); background:linear-gradient(135deg,#D4574A,var(--brick)); color:var(--white);
    font-weight:700; font-size:15px; padding:4px 10px; border-radius:3px;
    display:inline-block; box-shadow:1px 2px 0 rgba(0,0,0,.15); white-space:nowrap;
  }

  .field{display:block;margin-bottom:14px;}
  .field span{display:block;font-size:12.5px;opacity:.75;margin-bottom:5px;}
  .input{
    width:100%;padding:9px 11px;font-size:14px;border:1.5px solid var(--line);
    border-radius:4px;background:var(--white);color:var(--ink);outline:none;
  }
  .input:focus{border-color:var(--sage);}
  textarea.input{min-height:64px;resize:vertical;}

  .form-card{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:20px;max-width:420px;}

  .note{
    background:var(--paper-deep);border:1.5px solid var(--line);border-radius:6px;
    padding:8px 12px;font-size:12.5px;opacity:.8;margin-bottom:16px;
  }
  .note.warn{background:#F3E1DC;border-color:var(--brick);opacity:1;}

  .divider{border-top:1.5px dashed var(--line);}

  /* --- Notation par étoiles --- */
  .stars{display:inline-flex;gap:1px;}
  .star{font-size:16px;line-height:1;cursor:pointer;color:var(--line);transition:transform .1s ease, color .1s ease;user-select:none;}
  .star:hover{transform:scale(1.15);}
  .star.filled{color:var(--mustard);}
  .stars.readonly .star{cursor:default;}
  .stars.readonly .star:hover{transform:none;}

  .ratings-section{margin-top:36px;padding-top:26px;border-top:1.5px dashed var(--line);}
  .review-form{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:16px;max-width:420px;margin-bottom:22px;}
  .review-form .stars .star{font-size:20px;}
  .reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
  .review-cube{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px;aspect-ratio:1/1;display:flex;flex-direction:column;gap:8px;overflow:hidden;}
  .review-cube .stars .star{font-size:15px;}
  .review-text{margin:0;font-size:13px;line-height:1.4;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;}
  .review-date{font-size:11px;opacity:.55;}

  .cart-limit-note{font-size:12px;opacity:.65;margin-top:6px;}

  /* Static info pages: legal, terms, contact */
  .info-page{max-width:640px;padding-top:28px;}
  .info-page h2{font-size:26px;margin:0 0 6px;}
  .info-page h3{font-size:16px;margin:26px 0 6px;}
  .info-page p, .info-page li{font-size:14px;line-height:1.6;opacity:.85;}
  .info-page .placeholder-field{color:var(--brick);font-weight:600;}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;opacity:.7;margin-bottom:18px;background:none;border:none;padding:0;cursor:pointer;}
  .back-link:hover{opacity:1;}

  /* --- Footer --- */
  footer{border-top:2px solid var(--ink);background:var(--card);padding:34px 24px 26px;margin-top:34px;}
  .footer-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:28px;}
  @media (max-width:700px){.footer-inner{grid-template-columns:1fr;}}
  .footer-col h4{font-family:'Fraunces',serif;font-size:15px;margin:0 0 12px;}
  .footer-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .footer-col ul button, .footer-col ul a{
    background:none;border:none;padding:0;font-size:13px;color:var(--ink);opacity:.75;cursor:pointer;text-align:left;text-decoration:none;
  }
  .footer-col ul button:hover, .footer-col ul a:hover{opacity:1;text-decoration:underline;}
  .footer-col p{font-size:13px;opacity:.75;line-height:1.5;margin:0 0 6px;}
  .phone-block{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .phone-icon{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--white);}
  .phone-text a{font-family:'Fraunces',serif;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none;}
  .phone-text a:hover{text-decoration:underline;}
  .footer-bottom{max-width:1080px;margin:26px auto 0;padding-top:18px;border-top:1.5px solid var(--line);font-size:12px;opacity:.55;}

  #cartOverlay{position:fixed;inset:0;background:rgba(18,16,10,.38);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;}
  #cartOverlay.open{opacity:1;pointer-events:auto;}
  #cartDrawer{
    position:fixed;top:0;right:0;height:100%;width:min(380px, 92vw);
    background:var(--card);border-left:2px solid var(--ink);
    box-shadow:-6px 0 0 rgba(28,38,32,.08);
    transform:translateX(100%);transition:transform .22s ease;
    z-index:41;display:flex;flex-direction:column;
  }
  #cartDrawer.open{transform:translateX(0);}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1.5px dashed var(--line);flex-shrink:0;}
  .drawer-head h2{margin:0;font-size:20px;}
  .drawer-close{background:none;border:none;font-size:22px;line-height:1;color:var(--ink);padding:2px 6px;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .drawer-foot{padding:16px 20px 20px;border-top:1.5px dashed var(--line);flex-shrink:0;}
  .cart-item{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--line);border-radius:6px;padding:9px;}
  .cart-item .thumb{width:48px;height:48px;border-radius:4px;overflow:hidden;flex-shrink:0;}
  .cart-item .thumb img{width:100%;height:100%;object-fit:cover;}
  .cart-item .info{flex:1;min-width:0;}

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// ---------- Paiement ----------
// Remplacez par l'URL de votre backend une fois déployé (voir server.js fourni).
const BACKEND_URL = "https://market-place-shop-5f4z.onrender.com";

// ---------- State ----------
const uid = () => Math.random().toString(36).slice(2, 10);

const CATEGORIES = ["Vêtements", "Photo & vidéo", "Maison & déco", "Autre"];

let state = {
  products: [
    { id: uid(), name: "Veste en jean délavée", price: 28, category: "Vêtements", description: "Taille M, coupe vintage, petite usure au col.", photo: "https://images.unsplash.com/photo-1543076447-215ad9ba6923?w=700&q=80&auto=format&fit=crop" },
    { id: uid(), name: "Appareil photo argentique", price: 65, category: "Photo & vidéo", description: "Fonctionnel, testé, sans étui.", photo: "https://images.unsplash.com/photo-1495707902641-75cac588d2e9?w=700&q=80&auto=format&fit=crop" },
  ],
  cart: [],
  cartOpen: false,
  view: "shop",
  sellerMode: false,
  sellerToken: null,
  editing: null,
  order: null,
  formPhoto: null,
  query: "",
  categoryFilter: "Toutes",
  sortBy: "recent",
};

const currency = (n) => n.toLocaleString("fr-FR", { style: "currency", currency: "EUR" });

// ---------- Produits partagés (stockage persistant, visible par tous les visiteurs) ----------
async function saveProductsToStorage(){
  try {
    const headers = { "Content-Type": "application/json" };
    if (state.sellerToken) headers["Authorization"] = "Bearer " + state.sellerToken;
    const res = await fetch(`${BACKEND_URL}/products`, {
      method: "POST",
      headers,
      body: JSON.stringify({ products: state.products }),
    });
    if (res.status === 401){
      alert("Votre session vendeur a expiré. Reconnectez-vous pour enregistrer vos modifications.");
      state.sellerMode = false; state.sellerToken = null; render();
      return;
    }
    if (!res.ok) throw new Error("Réponse serveur non OK : " + res.status);
    localStorage.setItem('mps_products_cache', JSON.stringify(state.products));
  } catch(e){
    console.error('Erreur de sauvegarde des articles (backend)', e);
    try {
      localStorage.setItem('mps_products_cache', JSON.stringify(state.products));
      alert("Le serveur de sauvegarde n'a pas répondu : tes changements sont gardés uniquement dans CE navigateur pour l'instant, pas sur les autres appareils. Vérifie que ton backend Render est bien lancé, et qu'il autorise les requêtes depuis https://samft957-bot.github.io (réglage CORS côté serveur).");
    } catch(e2){
      alert("La sauvegarde a échoué. Essayez une image plus légère ou une URL d'image.");
    }
  }
}

async function loadProductsFromStorage(){
  try {
    const res = await fetch(`${BACKEND_URL}/products`);
    if (!res.ok) throw new Error("Réponse serveur non OK : " + res.status);
    const data = await res.json();
    if (data && Array.isArray(data.products) && data.products.length){
      state.products = data.products;
      localStorage.setItem('mps_products_cache', JSON.stringify(state.products));
    } else {
      await saveProductsToStorage();
    }
  } catch(e){
    console.error('Erreur de chargement des articles (backend), utilisation du cache local', e);
    const cached = localStorage.getItem('mps_products_cache');
    if (cached) { try { state.products = JSON.parse(cached); } catch(e2){} }
  }
}

// ---------- Avis clients (texte + étoiles) ----------
function loadReviews(){
  try { const raw = localStorage.getItem('mps_reviews'); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveReviews(list){ try { localStorage.setItem('mps_reviews', JSON.stringify(list)); } catch(e){} }
function hasPurchased(){ try { return localStorage.getItem('mps_has_purchased') === 'true'; } catch(e){ return false; } }
function markAsPurchased(){ try { localStorage.setItem('mps_has_purchased', 'true'); } catch(e){} }
function clearPurchasedFlag(){ try { localStorage.setItem('mps_has_purchased', 'false'); } catch(e){} }

state.reviews = loadReviews();
state.draftStars = 0;

function setDraftStars(n){ state.draftStars = n; render(); }

function submitReview(e){
  e.preventDefault();
  if (!hasPurchased()) return;
  const textEl = document.getElementById('review-text');
  const text = textEl ? textEl.value.trim() : "";
  if (!state.draftStars){ alert("Choisissez une note en étoiles."); return; }
  if (!text){ alert("Écrivez un petit commentaire."); return; }
  state.reviews.unshift({ id: uid(), stars: state.draftStars, text, date: new Date().toLocaleDateString('fr-FR') });
  saveReviews(state.reviews);
  state.draftStars = 0;
  clearPurchasedFlag();
  render();
}

function draftStarsHtml(){
  let stars = '';
  for (let i = 1; i <= 5; i++){
    const filled = i <= state.draftStars;
    stars += `<span class="star${filled ? ' filled' : ''}" onclick="setDraftStars(${i})" title="${i} étoile${i>1?'s':''}">★</span>`;
  }
  return stars;
}

function reviewCubeHtml(r){
  let stars = '';
  for (let i = 1; i <= 5; i++){ stars += `<span class="star${i <= r.stars ? ' filled' : ''}">★</span>`; }
  return `
    <div class="review-cube">
      <div class="stars readonly">${stars}</div>
      <p class="review-text">${escapeHtml(r.text)}</p>
      <div class="review-date">${r.date}</div>
    </div>
  `;
}

function averageRating(){
  if (!state.reviews.length) return null;
  const sum = state.reviews.reduce((s,r)=>s+r.stars,0);
  return (sum / state.reviews.length);
}

function ratingsSectionHtml(){
  const canWrite = hasPurchased();
  const writeBox = canWrite
    ? `
      <form class="review-form" onsubmit="submitReview(event)">
        <div class="stars" style="margin-bottom:8px;">${draftStarsHtml()}</div>
        <textarea class="input" id="review-text" placeholder="Partagez votre expérience..." style="min-height:70px;"></textarea>
        <button type="submit" class="btn btn-accent" style="margin-top:8px;">Publier mon avis</button>
      </form>
    `
    : `<div class="note">Vous pourrez laisser un avis une fois un achat effectué.</div>`;
  const cubes = state.reviews.length
    ? `<div class="reviews-grid">${state.reviews.map(reviewCubeHtml).join("")}</div>`
    : `<p style="opacity:.6;font-size:13.5px;">Aucun avis pour le moment. Soyez le·la premier·ère à en laisser un.</p>`;
  const avg = averageRating();
  const avgHtml = avg
    ? `<span style="font-weight:600;">${avg.toFixed(1)} / 5</span> sur ${state.reviews.length} avis`
    : "";
  return `
    <section class="ratings-section">
      <h2 class="section-title" style="font-size:22px;">Avis clients</h2>
      <p class="section-sub">${avgHtml || "Ce que pensent nos acheteurs."}</p>
      ${writeBox}
      ${cubes}
    </section>
  `;
}

// ---------- Actions ----------
function setView(v){ state.view = v; state.cartOpen = false; window.scrollTo({top:0}); render(); }

function toggleCart(){ state.cartOpen = !state.cartOpen; render(); }

// ---------- Mode vendeur : authentification côté serveur ----------
// Le mot de passe n'est plus comparé dans le navigateur (n'importe qui pouvait le lire
// dans le code source). Il doit être vérifié par votre backend, qui renvoie un jeton
// temporaire si le mot de passe est correct. Voir les instructions fournies pour
// ajouter la route /admin/login à votre serveur.
async function toggleSeller(){
  if (state.sellerMode){
    state.sellerMode = false; state.sellerToken = null;
    state.view = "shop"; state.editing = null; render();
    return;
  }
  const pwd = window.prompt("Mot de passe vendeur :");
  if (pwd === null || pwd === "") return;
  try {
    const res = await fetch(`${BACKEND_URL}/admin/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwd }),
    });
    if (!res.ok){ alert("Mot de passe incorrect."); return; }
    const data = await res.json();
    if (!data.token){ alert("Réponse du serveur inattendue."); return; }
    state.sellerToken = data.token;
    state.sellerMode = true;
    state.view = "admin";
    state.editing = null;
    render();
  } catch(e){
    alert("Impossible de vérifier le mot de passe : le serveur d'authentification n'a pas répondu. Le mode vendeur reste protégé côté serveur, contactez votre développeur pour vérifier que la route /admin/login est bien déployée.");
  }
}

function addToCart(id){
  const p = state.products.find(x => x.id === id);
  if (!p) return;

  const already = state.cart.find(x => x.id === id);

  if (already){
    already.qty += 1;
  } else {
    state.cart.push({ ...p, qty: 1 });
  }

  state.cartOpen = true;
  render();
}

function setQty(id, qty){ if (qty <= 0) { state.cart = state.cart.filter(x => x.id !== id); } render(); }
function removeFromCart(id){ state.cart = state.cart.filter(x => x.id !== id); render(); }

function startEdit(id){
  state.editing = id ? state.products.find(p => p.id === id) : "new";
  state.formPhoto = state.editing === "new" ? null : state.editing.photo;
  render();
}
function cancelEdit(){ state.editing = null; state.formPhoto = null; render(); }

async function deleteProduct(id){
  if (!window.confirm("Retirer définitivement cet article de la boutique ?")) return;
  state.products = state.products.filter(p => p.id !== id);
  render();
  await saveProductsToStorage();
}

async function saveProduct(e){
  e.preventDefault();
  const name = document.getElementById('f-name').value.trim();
  const price = Number(document.getElementById('f-price').value);
  const category = document.getElementById('f-category').value;
  const description = document.getElementById('f-desc').value.trim();
  const paymentLink = document.getElementById('f-paylink').value.trim();
  if (!name || !(price > 0)) return;
  const isNew = state.editing === "new";
  const id = isNew ? uid() : state.editing.id;
  const product = { id, name, price, category, description, photo: state.formPhoto, paymentLink: paymentLink || null };
  if (isNew) state.products.unshift(product);
  else state.products = state.products.map(p => p.id === id ? product : p);
  state.editing = null;
  state.formPhoto = null;
  render();
  await saveProductsToStorage();
}

function handleFile(e){
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { state.formPhoto = reader.result; render(); };
  reader.readAsDataURL(file);
}
function setPhotoUrl(){
  const val = document.getElementById('f-photourl').value.trim();
  if (val) { state.formPhoto = val; render(); }
}
function clearPhoto(){ state.formPhoto = null; render(); }

function goCheckout(){ state.view = "checkout"; state.cartOpen = false; render(); }

async function payWithStripe(){
  const btn = document.getElementById('pay-btn');
  btn.disabled = true; btn.textContent = "Redirection vers Stripe...";
  try {
    const res = await fetch(`${BACKEND_URL}/create-checkout-session`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cart: state.cart.map(i => ({ name: i.name, price: i.price, qty: i.qty })),
        successUrl: window.location.origin + window.location.pathname + "?payment=success",
        cancelUrl: window.location.origin + window.location.pathname + "?payment=cancel",
      }),
    });
    const data = await res.json();
    if (data.url) { window.location.href = data.url; }
    else {
      alert("Erreur : " + (data.error || "impossible de créer le paiement."));
      btn.disabled = false; btn.textContent = "Payer avec Stripe";
    }
  } catch (err) {
    alert("Impossible de contacter le serveur de paiement. Vérifiez que BACKEND_URL est bien configuré.");
    btn.disabled = false; btn.textContent = "Payer avec Stripe";
  }
}

(function checkPaymentReturn(){
  const params = new URLSearchParams(window.location.search);
  if (params.get("payment") === "success"){
    state.cart = [];
    state.view = "confirmation";
    markAsPurchased();
    window.history.replaceState({}, "", window.location.pathname);
  } else if (params.get("payment") === "cancel"){
    state.view = "shop";
    state.cartOpen = true;
    window.history.replaceState({}, "", window.location.pathname);
  }
})();

// ---------- Recherche, filtres, tri ----------
function setQuery(v){
  state.query = v;

  // Met à jour uniquement la partie boutique pour que le champ de recherche
  // garde le focus et que l'on puisse écrire autant de caractères que voulu.
  const main = document.getElementById('main');
  if (!main || state.view !== "shop") {
    render();
    return;
  }

  const active = document.activeElement;
  const search = active && active.matches('.filter-bar .search input') ? active : null;
  const cursorStart = search ? search.selectionStart : null;
  const cursorEnd = search ? search.selectionEnd : null;

  main.innerHTML = renderShop();

  const newSearch = main.querySelector('.filter-bar .search input');
  if (newSearch) {
    newSearch.focus();
    if (cursorStart !== null && cursorEnd !== null) {
      newSearch.setSelectionRange(cursorStart, cursorEnd);
    }
  }

  // Le panier reste à jour sans fermer le champ de recherche.
  const drawer = document.getElementById('cartDrawer');
  const overlay = document.getElementById('cartOverlay');
  drawer.innerHTML = renderCartDrawer();
  drawer.classList.toggle('open', state.cartOpen);
  overlay.classList.toggle('open', state.cartOpen);
  refreshAds();
}
function setCategoryFilter(c){ state.categoryFilter = c; render(); }
function setSortBy(v){ state.sortBy = v; render(); }

function filteredProducts(){
  let list = state.products.slice();
  if (state.query.trim()){
    const q = state.query.trim().toLowerCase();
    list = list.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.description || "").toLowerCase().includes(q) ||
      (p.category || "").toLowerCase().includes(q)
    );
  }
  if (state.categoryFilter !== "Toutes"){
    list = list.filter(p => p.category === state.categoryFilter);
  }
  if (state.sortBy === "price-asc") list.sort((a,b)=>a.price-b.price);
  else if (state.sortBy === "price-desc") list.sort((a,b)=>b.price-a.price);
  return list;
}

function refreshAds(){

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  else { buyBtn = `<button class="btn btn-accent" onclick="${buyAction}">${inCart ? "Ajouter encore" : "Ajouter au panier"}</button>`; }

    ? `<div style="display:flex;gap:6px;">

function renderContact(){
  return `
    <div class="info-page">
      <button class="back-link" onclick="setView('shop')">← Retour à la boutique</button>
      <h2>Nous contacter</h2>
      <p>Une question sur un article, une commande ou une livraison ? Écrivez-nous, nous répondons sous 24 à 48h.</p>
      <form class="form-card" style="max-width:480px;" onsubmit="submitContact(event)">
        <label class="field"><span>Votre nom</span><input class="input" id="c-name" required></label>
        <label class="field"><span>Votre email</span><input class="input" id="c-email" type="email" required></label>
        <label class="field"><span>Votre message</span><textarea class="input" id="c-message" required placeholder="Décrivez votre demande..."></textarea></label>
        <button type="submit" class="btn btn-accent">Envoyer le message</button>
      </form>
      <p style="margin-top:18px;font-size:13px;opacity:.65;">Vous pouvez aussi nous joindre directement par téléphone au <a href="tel:+32466369367" style="text-decoration:underline;">+32 466 36 93 67</a>.</p>
    </div>
  `;
}

function submitContact(e){
  e.preventDefault();
  const name = document.getElementById('c-name').value.trim();
  const email = document.getElementById('c-email').value.trim();
  const message = document.getElementById('c-message').value.trim();
  const subject = encodeURIComponent("Message depuis Market place shop — " + name);
  const body = encodeURIComponent(`${message}\n\n— ${name} (${email})`);
  // Solution simple sans backend dédié : ouvre le client email du visiteur, pré-rempli.
  window.location.href = `mailto:contact@marketplaceshop.example?subject=${subject}&body=${body}`;
}

function render(){
  renderHeaderActions();
  const main = document.getElementById('main');
  if (state.view === "shop") main.innerHTML = renderShop();
  else if (state.view === "admin") main.innerHTML = renderAdmin();
  else if (state.view === "checkout") main.innerHTML = renderCheckout();
  else if (state.view === "confirmation") main.innerHTML = renderConfirmation();
  else if (state.view === "terms") main.innerHTML = renderTerms();
  else if (state.view === "legal") main.innerHTML = renderLegal();
  else if (state.view === "contact") main.innerHTML = renderContact();

  const drawer = document.getElementById('cartDrawer');
  const overlay = document.getElementById('cartOverlay');
  drawer.innerHTML = renderCartDrawer();
  drawer.classList.toggle('open', state.cartOpen);
  overlay.classList.toggle('open', state.cartOpen);
  refreshAds();
}

(async function init(){
  document.getElementById('main').innerHTML = `<p style="opacity:.6;padding:40px 0;text-align:center;">Chargement des articles…</p>`;
  await loadProductsFromStorage();
  render();
})();
</script>
